<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8fafc" />
    <title>Todo App</title>
  </head>
  <body class="min-h-screen bg-slate-100 text-slate-800">
    <main class="mx-auto w-full max-w-xl px-4 py-10 sm:py-16">
      <section class="rounded-2xl bg-white p-5 shadow-xl shadow-slate-200/70 sm:p-8">
        <header class="mb-6">
          <p class="mb-1 text-sm font-semibold uppercase tracking-widest text-indigo-500">
            Daily planner
          </p>
          <h1 class="text-3xl font-bold text-slate-900">My Todo List</h1>
        </header>

        <!-- Students: a form lets users submit tasks with Enter or the Add button. -->
        <form id="todo-form" class="mb-5 flex gap-2" autocomplete="off">
          <label for="todo-input" class="sr-only">New todo</label>
          <input
            id="todo-input"
            name="todo"
            type="text"
            maxlength="100"
            placeholder="What needs to be done?"
            class="min-w-0 flex-1 rounded-lg border border-slate-300 px-4 py-3 outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200"
          />
          <button
            type="submit"
            class="rounded-lg bg-indigo-600 px-4 py-3 font-semibold text-white transition hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:ring-offset-2"
          >
            Add
          </button>
        </form>

        <div class="mb-4 flex flex-wrap items-center justify-between gap-3">
          <div id="filters" class="flex gap-1 rounded-lg bg-slate-100 p-1" aria-label="Filter todos">
            <button type="button" data-filter="all" class="filter-button rounded-md bg-white px-3 py-1.5 text-sm font-semibold shadow-sm">
              All
            </button>
            <button type="button" data-filter="active" class="filter-button rounded-md px-3 py-1.5 text-sm font-semibold text-slate-500">
              Active
            </button>
            <button type="button" data-filter="completed" class="filter-button rounded-md px-3 py-1.5 text-sm font-semibold text-slate-500">
              Completed
            </button>
          </div>
          <p id="todo-count" class="text-sm text-slate-500" aria-live="polite"></p>
        </div>

        <ul id="todo-list" class="space-y-2" aria-label="Todo items"></ul>

        <button
          id="clear-completed"
          type="button"
          class="mt-5 hidden text-sm font-semibold text-slate-500 transition hover:text-red-600"
        >
          Clear completed
        </button>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
