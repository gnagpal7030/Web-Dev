<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acer Laptop</title>
</head>

<body>
    <div style="border:5px solid brown; padding: 5px; padding: 10px;">
        <h1>Acer Laptop</h1>
        <img src="../images/laptop.jpeg" alt="Acer Laptops">
        <h2>Price: $12</h2>
        <h2>Description: This is a good coding laptop.</h2>
    </div>
    <div style="border:1px solid black;padding: 10px; margin-top: 10px;">
        <form>

            <label for="address">Address:</label>
            <input id="address" type="text" placeholder="#123, XYZ Colony, ABC City">

            <br>

            <label for="delivery mode">Delievery Mode:</label>
            <input type="radio" name="d-mode"> Fast
            <input type="radio" name="d-mode"> Slow

            <br>

            <label for="accessories">Include Accessories</label>
            <br>
            <input type="checkbox"> Mouse <br>
            <input type="checkbox"> Keyboard <br>
            <input type="checkbox"> Screen Protector

            <br>

            Please give ratings based on your experience:
            <select>

                <option value="">Excellent</option>
                <option value="" selected>Average</option>
                <option value="">Bad</option>

            </select>

            <br>

            Anything want to say about our service:
            <textarea rows="10" cols="30"></textarea>

            <br>
            <button>Cancel Order</button>
            <input type="submit" value="Order Now">
            <input type="reset" value="Reset selection">
        </form>
    </div>
</body>

</html>
