<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Manipulation Demonstration</title>
    <style>
        .highlight {
            background-color: yellow;
            font-weight: bold;
        }

        .hidden {
            display: none;
            /* This text is hidden via CSS */
        }

        .box {
            border: 1px solid #ccc;
            padding: 10px;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <h1 id="main-title">DOM Fundamentals</h1>

    <div class="card-container">
        <p class="description">This is the first paragraph with some text.</p>
        <p class="description">This is the second paragraph.</p>
    </div>

    <input type="text" id="username-input" value="Gaurav" placeholder="Enter name">
    <br><br>

    <button id="action-btn">Click Me</button>

    <!-- Test Container -->
    <div id="demo-box">
        <p>Hello, <span>Gaurav</span>!</p>
        <p class="hidden">This is secret hidden text.</p>
    </div>

    <script>
        // ==========================================
        // 1. SEARCHING ELEMENTS
        // ==========================================

        // getElementById: Selects a single unique element by its ID
        const mainTitle = document.getElementById('main-title');
        console.log("Found by ID:", mainTitle);

        // querySelector: Selects the FIRST element that matches any CSS selector (.class, #id, tag)
        const firstParagraph = document.querySelector('.description');
        console.log("Found by querySelector:", firstParagraph);

        // querySelectorAll: Selects ALL matching elements and returns a NodeList (like an array)
        const allParagraphs = document.querySelectorAll('.description');
        console.log("Found all paragraphs count:", allParagraphs.length);


        // ==========================================
        // 2. ATTRIBUTES (Getting, Setting, Checking)
        // ==========================================

        const inputField = document.getElementById('username-input');

        // getAttribute: Reads the current value of an HTML attribute
        const currentType = inputField.getAttribute('type');
        console.log("Input type attribute:", currentType); // Output: "text"

        // setAttribute: Creates or updates an attribute value on the element
        inputField.setAttribute('placeholder', 'Type your username here...');

        // hasAttribute: Checks if a specific attribute exists (returns true/false)
        console.log("Has value attribute?", inputField.hasAttribute('value')); // Output: true

        // removeAttribute: Deletes an attribute entirely from the element
        // inputField.removeAttribute('value');


        // ==========================================
        // 3. NODE PROPERTIES (Type, Tag & Content)
        // ==========================================

        const titleElement = document.getElementById('main-title');

        // nodeType: Returns a number representing the type of node (e.g., 1 for Element node, 3 for Text node)
        console.log("Node Type number:", titleElement.nodeType); // Output: 1

        // titleElement.firstChild points to the text "DOM Fundamentals" inside the h1
        // In the DOM, the raw text written inside an HTML tag is stored as its own separate child node—called a Text Node—rather than being part of the element tag itself.

        const textNode = titleElement.firstChild;

        console.log(textNode.nodeType); // Output: 3
        console.log(textNode.nodeValue); // Output: "DOM Fundamentals"

        // tagName: Returns the HTML tag name in uppercase string format
        console.log("Tag Name:", titleElement.tagName); // Output: "H1"

        const box = document.getElementById('demo-box');

        // ==========================================
        // 1. innerText
        // ==========================================
        // - Ignores hidden elements (display: none).
        // - Returns only the human-readable visible text.
        // - Triggers a browser layout calculation (reflow), making it slower for performance.
        console.log("--- innerText ---");
        console.log(box.innerText);
        /* Output:
           Hello, Gaurav!
           (Notice that "This is secret hidden text." is completely ignored because of display: none)
        */


        // ==========================================
        // 2. textContent
        // ==========================================
        // - Returns ALL text inside the element, INCLUDING hidden text.
        // - Preserves raw spacing and line breaks written in the HTML source.
        // - Much faster than innerText because it doesn't care about CSS styling or layout.
        console.log("--- textContent ---");
        console.log(box.textContent);
        /* Output:
           Hello, Gaurav!
           This is secret hidden text.
        */


        // ==========================================
        // 3. innerHTML
        // ==========================================
        // - Returns the text AND the actual HTML tag structure inside the element as a string.
        // - Allows you to read or rewrite entire HTML blocks dynamically.
        console.log("--- innerHTML ---");
        console.log(box.innerHTML);
        /* Output:
           <p>Hello, <span>Gaurav</span>!</p>
           <p class="hidden">This is secret hidden text.</p>
        */


        // ==========================================
        // 4. CHANGING CONTENT IN HTML ELEMENTS
        // ==========================================

        const button = document.getElementById('action-btn');

        // Listen for a click event to dynamically modify content
        button.addEventListener('click', function () {

            // Changing text content using textContent (safe from HTML injection attacks)
            mainTitle.textContent = "🚀 DOM Content Successfully Updated!";

            // Changing HTML structure and content dynamically using innerHTML
            const container = document.querySelector('.card-container');
            container.innerHTML = `
                <p class="highlight">This new paragraph was injected dynamically using innerHTML!</p>
                <ul>
                    <li>Dynamic Item 1</li>
                    <li>Dynamic Item 2</li>
                </ul>
            `;

            // Changing input values or element attributes dynamically
            inputField.value = "Admin User";
        });
        
        
        // TODO: Read about async and defer
    </script>

</body>

</html>
