<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transitions Demonstration</title>
    <style>
        div {
            width: 100px;
            height: 100px;
            background-color: red;
            transition: width 2s, height 4s, background-color 3s, color 5s;
        }

        div:hover {
            width: 300px;
            height: 300px;
            background-color: orange;
            color: blueviolet;
        }
    </style>
</head>

<body>
    <!-- 
    
    CSS transitions allows you to change property values smoothly, over a given duration. 
     
    To create a transition effect, you must specify the CSS property you want to add a transition to, and the duration of the transition.

    -->

    <h1>The transition Property</h1>

    <p>Hover over the div element below, to see the transition effect:</p>

    <div>Check my color</div>

    <!-- TODO: Read more about Transitions Properties -->

</body>

</html>
