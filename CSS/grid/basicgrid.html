<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Demonstration</title>
    <style>
        .container {
            display: inline-grid;
            grid-template-columns: auto auto auto;
            background-color: dodgerblue;
            padding: 10px;
        }

        .container div {
            background-color: #f1f1f1;
            border: 1px solid black;
            padding: 10px;
            font-size: 30px;
            text-align: center;
        }
    </style>
</head>

<body>

    <!-- 
        The Grid Layout Module offers a grid-based layout system, with rows and columns.

        The Grid Layout Module allows developers to easily create complex web layouts.

        The Grid Layout Module makes it easy to design a responsive layout structure, without using float or positioning.

        CSS Grid - 2 dimensional
        CSS Flexbox - 1 dimensional

        A grid always consists of:

        A Grid Container - The parent (container) element, where the display property is set to grid or inline-grid
        
        One or more Grid Items - The direct children of the grid container automatically becomes grid items

        A grid container contains one or more grid items arranged in columns and rows.

        All direct child elements of a grid container automatically become grid items.

        An element becomes a grid container when its display property is set to grid or inline-grid.
        
    -->
    <div class="container">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
    </div>


</body>

</html>
