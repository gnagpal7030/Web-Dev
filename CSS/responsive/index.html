<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive CSS</title>
</head>

<body>

    <!-- CSS Responsiveness refers to designing web pages that automatically adjust and look great on any screen size—whether it's a massive desktop monitor, a tablet, or a mobile phone. -->

    <!-- 
    
    Some ways to achieve responsiveness:
    1. Fluid Layouts (Relative Units)
    nstead of using rigid, fixed pixels (px) which break on smaller screens, responsive design uses relative units like percentages (%), viewport units (vw/vh), or rem so elements scale proportionally with the screen size.

    2. Flexible Images and Media
    Images with fixed pixel widths will overflow and break a mobile layout. Making them fluid ensures they shrink to fit their container.

    3. Media Queries (@media)
    Media queries allow you to apply different CSS rules based on the device's characteristics, most commonly its screen width (known as breakpoints).

    4. Modern Layout Systems (Flexbox & CSS Grid)
    Modern CSS layout models are inherently flexible and handle reflowing content automatically with minimal code, reducing the reliance on heavy media queries.
    -->

</body>

</html>
