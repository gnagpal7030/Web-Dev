<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Container Properties</title>
    <style>
        .container {
            margin-top: 5px;
            display: flex;
            /* Change to inline-flex*/
            background-color: #808080;
            flex-direction: row;
            flex-wrap: nowrap;
        }

        .container div {
            background-color: darkorange;
            padding: 20px;
            margin: 10px;
            font-size: 20px;
            width: 50px;
        }
    </style>
</head>

<body>
    <!-- 
    
    display - Must be set to flex or inline-flex
    flex-direction - Sets the display-direction of flex items
    flex-wrap - Specifies whether the flex items should wrap or not
    flex-flow - Shorthand property for flex-direction and flex-wrap
    flex-flow: row nowrap;
    -->

    <div class="container">
        <div>Item 1</div>
        <div>Item 2</div>
        <div>Item 3</div>
        <div>Item 4</div>
        <div>Item 5</div>
        <div>Item 6</div>
        <div>Item 7</div>
        <div>Item 8</div>
    </div>

    <!-- <br> -->
    <div class="container">
        <div>Item 1</div>
        <div>Item 2</div>
        <div>Item 3</div>
        <div>Item 4</div>
    </div>

    <div class="container">
        <div>Item 1</div>
    </div>

</body>

</html>
