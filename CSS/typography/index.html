    <!-- 
    CSS typography controls the appearance, layout, and readability of text on a web page. By combining font styling, text spacing, and layout properties, you can establish visual hierarchy and improve user experience. 
    Here is a comprehensive breakdown of the core CSS properties used to handle web typography:
    ## 1. Font Styling Properties
    These properties alter the physical appearance of the typeface itself. [4] 

    * font-family: Sets the typeface or a prioritized list of fallback fonts (called a "font stack"). Always include a generic family at the end. 

    font-family: "Inter", "Helvetica Neue", sans-serif;

    * font-size: Adjusts the scale of the text. Best practice dictates using relative units like rem or em for accessibility and responsive scaling, or clamp() for fluid sizing. 

    font-size: 1.25rem; 

    * font-weight: Sets text thickness using keywords (normal, bold) or numeric values ranging from 100 to 900.

    font-weight: 600; /* Semi-bold */

    * font-style: Changes text presentation to italic or oblique.

    * text-transform: Controls letter capitalization (uppercase, lowercase, capitalize). 

    ## 2. Spacing & Text Layout Properties
    These properties adjust how text flows, interacts with its container, and paces itself vertically and horizontally.

    * line-height: Controls the vertical space between lines of text. 

    line-height: 1.6;

    * letter-spacing: Adjusts the horizontal tracking (gaps between individual characters). 
    * text-align: Dictates horizontal text alignment (left, right, center, justify). 

    ## 3. TODO: Loading Custom Fonts
    To use custom typographies not built into native operating systems, use the @font-face rule to declare files hosted on your server or integrate third-party links via platforms like [Google Fonts](https://fonts.google.com/).
 -->
