<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Basic Properties</title>
    <link rel="stylesheet" href="./css/css-apply.css">

    <style>
        h2 {
            color: blue;
        }
    </style>

</head>

<body>

    <!-- Inline CSS -->
    <h1 style="color:red">CSS is applied as inline</h1>

    <!-- Internal CSS -->
    <h2>CSS is applied as internal</h2>

    <!-- External CSS -->
    <h3>CSS is applied as external</h3>

</body>

</html>
