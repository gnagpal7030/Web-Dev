<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z index Nested Elements</title>
    <style>
        div {
            font-size: 24px;
            padding: 12px;
        }

        div.parent {
            position: relative;
            top: 0;
            left: 0;

            /* specifying z-index value */
            z-index: 3;

            width: 500px;
            height: 150px;
            background: greenyellow;
        }

        div.child {
            position: relative;
            left: 200px;
            top: 20px;
            background: skyblue;

            /* specifying negative z-index value */
            z-index: 50;

            width: 300px;
            height: 120px;
            padding-left: 120px;
        }

        div.outer {
            position: relative;
            top: -10px;
            left: 0;

            /* specifying negative z-index value */
            z-index: 6;

            width: 280px;
            height: 120px;
            background: orange;
        }
    </style>
</head>

<body>

    <div class="parent">
        Parent Element<br />
        position: relative; <br />z-index: 3;

        <!-- Child elements have the highest z-index value -->

        <div class="child">
            Child Element <br />
            z-index: 50;<br />
            position: relative;
        </div>
    </div>
    <div class="outer">
        Outer Element <br />position: relative; <br />z-index: 6;
    </div>

</body>

</html>
