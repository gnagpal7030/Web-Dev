<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Max Width Demonstration</title>
    <style>
        /*

        The max-width property defines the maximum width of an element.

        This property prevents the element's width from being larger than the specified value (it can be smaller, but not larger).

        This property is useful for creating responsive layouts and to ensure content readability across various screen sizes.

        Problem with width:
        If we have a horizontally centered <div> element with a specific width (600px):

        */
    </style>
</head>

<body>

    <div style="width: 600px; margin: auto; border: 1px solid red;">
        This div element has a width of 600px, and margin set to auto. This div element has a width of 600px, and
        margin set to auto.
    </div>

    <br>

    <div style="max-width: 600px; margin: auto; border: 1px solid brown;">
        This div element has a max-width of 600px, and margin set to auto. This div element has a width of 600px, and
        margin set to auto.
    </div>

</body>

</html>
